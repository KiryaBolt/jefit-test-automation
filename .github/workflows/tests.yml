name: Jefit autotests

on:
  # Запуск только вручную: вкладка Actions -> Jefit autotests -> Run workflow
  workflow_dispatch:
    inputs:
      filter:
        description: 'Extra NUnit filter, e.g. Category=smoke (empty = all)'
        required: false
        default: ''

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  RESULTS_DIR: Jefit.Test/bin/Release/net8.0/allure-results
  JEFIT_TestSettings__UserEmail: ${{ secrets.JEFIT_EMAIL }}
  JEFIT_TestSettings__UserPassword: ${{ secrets.JEFIT_PASSWORD }}

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build JefitAutomation.sln -c Release

      - name: Run API tests
        run: |
          FILTER="Category=api"
          if [ -n "${{ inputs.filter }}" ]; then FILTER="$FILTER&${{ inputs.filter }}"; fi
          dotnet test Jefit.Test -c Release --no-build \
            --settings runsettings/parallel.runsettings \
            --filter "$FILTER" --logger "trx;LogFileName=api.trx"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: ${{ env.RESULTS_DIR }}
          retention-days: 7

  ui-tests:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]   # cross-browser plan (Edge не используем)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build JefitAutomation.sln -c Release

      - name: Run UI tests in ${{ matrix.browser }}
        run: |
          FILTER="Category=ui"
          if [ -n "${{ inputs.filter }}" ]; then FILTER="$FILTER&${{ inputs.filter }}"; fi
          dotnet test Jefit.Test -c Release --no-build \
            --settings runsettings/${{ matrix.browser }}.runsettings \
            --filter "$FILTER" --logger "trx;LogFileName=ui-${{ matrix.browser }}.trx"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 7

  allure-report:
    name: Allure report
    needs: [ api-tests, ui-tests ]
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: allure-report
      cancel-in-progress: false
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      # История: берём папку history из прошлого опубликованного отчёта (ветка gh-pages).
      # Если ветки ещё нет (первый запуск), шаг не падает.
      - name: Load previous report
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore history into results
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
            echo "История найдена, файлов: $(ls gh-pages/history | wc -l)"
          else
            echo "Истории пока нет: она появится после этого запуска"
          fi

      # Номер запуска нужен, чтобы на графиках истории подписывать точки
      - name: Add run info
        run: |
          cat > allure-results/executor.json <<'EOF'
          {"name":"GitHub Actions","type":"github","url":"${{ github.server_url }}/${{ github.repository }}","buildOrder":${{ github.run_number }},"buildName":"Запуск №${{ github.run_number }}","buildUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","reportName":"Jefit Allure Report"}
          EOF

      - name: Install Allure commandline
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      # Отчёт вместе с новой папкой history публикуется в gh-pages и станет историей для следующего запуска
      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
